[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-local-image-provider"
version = "0.1.0"
description = "Isolated SSD-1B local GPU provider for EOM background generation"
requires-python = ">=3.11,<3.13"
dependencies = [
  # Separate Blackwell/CUDA runtime; never install these into API, Web, or HWPX environments.
  "accelerate==1.10.1",
  "diffusers==0.35.2",
  # Shared fixed stdlib physical-GPU mutex; no trainer or platform service import.
  "eom-gpu-lease==0.1.0",
  "eom-image-contracts==0.1.0",
  "huggingface-hub==0.35.3",
  # Diffusers delegates immutable LoRA adapter loading to PEFT on the reference-style route.
  "peft==0.17.1",
  "Pillow==11.3.0",
  "safetensors==0.6.2",
  "torch==2.7.1",
  "transformers==4.56.2",
]

[project.optional-dependencies]
# CPU Canny conditioning in the numerical lab only; no Qt/X11/contrib or model download.
sdxl-canny = ["opencv-python-headless==4.11.0.86"]
# Optional CPU CLIP input validation/canonical float32 bytes; matches the installed trainer.
sdxl-ip-style = ["numpy==2.4.6"]

[project.scripts]
eom-local-image = "eom_image_provider.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_image_provider*"]

[tool.setuptools.package-data]
eom_image_provider = ["notices/*.txt"]
