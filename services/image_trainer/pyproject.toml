[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-local-image-trainer"
version = "0.1.0"
description = "Isolated bounded LoRA dataset and training adapter for EOM images"
requires-python = ">=3.11,<3.13"
dependencies = [
  "eom-image-contracts==0.1.0",
  # Required for explicit JSON Schema 2020-12 failure normalization at the adapter boundary.
  "jsonschema==4.25.1",
  # Required to decode, crop, resize, hash, and serialize staged PNG training samples.
  "Pillow==11.3.0",
  # Required for exact immutable training-contract validation and stable error normalization.
  "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_image_trainer*"]
