[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-hwpx-builder"
version = "0.1.0"
description = "Isolated reference-template-first HWPX POC builder"
requires-python = ">=3.12,<3.13"
dependencies = [
  "eom-hwpx-contracts==0.1.0",
  "lxml==6.0.0",
  "Pillow==11.3.0",
  "pydantic==2.11.7",
  "typer==0.16.0",
]

[project.scripts]
eom-hwpx = "eom_hwpx_builder.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_hwpx_builder*"]

[tool.setuptools.package-data]
eom_hwpx_builder = ["*.mjs"]
