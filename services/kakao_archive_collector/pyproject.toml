[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-kakao-archive-collector"
version = "0.1.0"
description = "Private fixed-profile Kakao browser process supervisor"
requires-python = ">=3.12,<3.13"
# Only staged input validation. Browser dependencies belong to the separately pinned driver.
dependencies = ["eom-kakao-archive-contracts==0.1.0"]

[project.optional-dependencies]
# Official publisher release checked 2026-11-16. Install only in the dedicated
# browser Conda runtime with its matching Chromium; never in the API/PDF runtime.
# Host x11-utils (xdpyinfo) verifies authenticated X11 readiness. Reuse the existing
# system utility; it is not a Python dependency, background service or GPU workload.
manual-browser = ["playwright==1.65.2"]

[project.scripts]
eom-kakao-browser-supervisor = "eom_kakao_archive_collector.supervisor:main"
eom-kakao-browser-driver = "eom_kakao_archive_collector.manual_driver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_kakao_archive_collector*"]
