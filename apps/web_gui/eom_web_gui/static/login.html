<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4F46E5">
    <title>EOM Scientific Studio 로그인</title>
    <link rel="icon" href="/studio/assets/eom-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/studio/assets/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <img class="brand-seal" src="/studio/assets/eom-mark.svg" alt="" width="54" height="54">
        <h1 id="login-title">EOM Scientific Studio</h1>
        <form id="login-form">
          <label for="username">사용자 이름</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>
          <button class="button primary" type="submit">Studio 시작</button>
        </form>
      </section>
    </main>
    <script type="module" src="/studio/assets/login.js"></script>
  </body>
</html>
