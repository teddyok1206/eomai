<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · EOM Observability Console</title>
    <link rel="stylesheet" href="/observe/assets/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <p class="eyebrow">READ-ONLY OPERATIONS</p>
        <h1 id="login-title">EOM Observability Console</h1>
        <form id="login-form">
          <label for="access-token">Access token</label>
          <input id="access-token" name="token" type="password" required autocomplete="current-password" minlength="16">
          <p class="form-error" id="login-error" role="alert"></p>
          <button class="primary-button" type="submit">Sign in</button>
        </form>
      </section>
    </main>
    <script type="module" src="/observe/assets/login.js"></script>
  </body>
</html>
