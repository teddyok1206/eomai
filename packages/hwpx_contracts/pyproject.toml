[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-hwpx-contracts"
version = "0.1.0"
description = "Strict contracts for the EOM HWPX POC"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.25.1", "pydantic==2.11.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_hwpx_contracts*"]

[tool.setuptools.package-data]
eom_hwpx_contracts = ["schemas/*.json"]
