[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-kakao-archive-contracts"
version = "0.1.0"
description = "Pure versioned contracts for isolated EOM Kakao archive workers"
requires-python = ">=3.12,<3.13"
# Shared pure contracts support the API's 4.26.0 and isolated workers' 4.25.1.
# Deployment manifests still pin one concrete runtime version independently.
# The study family reuses pinned predecessor definitions through a closed,
# in-memory JSON Schema registry; referencing is already installed with jsonschema.
dependencies = ["jsonschema>=4.25.1,<4.27", "pydantic==2.13.4", "referencing>=0.37,<0.38"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_kakao_archive_contracts*"]

[tool.setuptools.package-data]
eom_kakao_archive_contracts = ["schemas/*.json", "py.typed"]
