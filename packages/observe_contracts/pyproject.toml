[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-observe-contracts"
version = "0.1.0"
description = "Versioned contracts for the EOM read-only observability API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "pydantic==2.11.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eom_observe_contracts*"]
