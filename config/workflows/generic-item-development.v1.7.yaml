schema_version: "1.0"
definition_key: "generic-item-development"
definition_version: "1.7.0"
start_step: "authoring"

limits:
  max_rework_cycles: 3
  max_step_attempts: 4

steps:
  - key: "authoring"
    type: "agent"
    worker_role: "authoring"
    result_schema: "authoring-result@7.0"
    on_success: "review"

  - key: "review"
    type: "agent"
    worker_role: "review"
    result_schema: "review-result@7.0"
    on_success: "human_approval"

  - key: "human_approval"
    type: "human_gate"
    allowed_actor_roles:
      - "reviewer"
      - "admin"
    allowed_rework_targets:
      - "authoring"
      - "review"
    on_approve: "registration"

  - key: "registration"
    type: "agent"
    worker_role: "item_management"
    result_schema: "registration-result@7.0"
    on_success: "complete"

  - key: "complete"
    type: "terminal"
    terminal_status: "COMPLETED"
