schema_version: "1.0"
definition_key: "material-learning"
definition_version: "1.0.0"
start_step: "learn"

limits:
  max_rework_cycles: 0
  max_step_attempts: 1

steps:
  - key: "learn"
    type: "agent"
    worker_role: "support"
    result_schema: "material-learning-result@1.0"
    on_success: "complete"

  - key: "complete"
    type: "terminal"
    terminal_status: "COMPLETED"
