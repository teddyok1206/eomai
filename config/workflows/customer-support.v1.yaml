schema_version: "1.0"
definition_key: "customer-support"
definition_version: "1.0.0"
start_step: "diagnose"

limits:
  max_rework_cycles: 0
  max_step_attempts: 1

steps:
  - key: "diagnose"
    type: "agent"
    worker_role: "support"
    result_schema: "customer-support-result@1.0"
    on_success: "complete"

  - key: "complete"
    type: "terminal"
    terminal_status: "COMPLETED"
