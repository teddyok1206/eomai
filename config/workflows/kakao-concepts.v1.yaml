schema_version: "1.0"
definition_key: "kakao-concepts"
definition_version: "1.0.0"
start_step: "assist"

limits:
  max_rework_cycles: 0
  max_step_attempts: 1

steps:
  - key: "assist"
    type: "agent"
    worker_role: "support"
    result_schema: "kakao-concepts-result@1.0"
    on_success: "complete"

  - key: "complete"
    type: "terminal"
    terminal_status: "COMPLETED"
