schema_version: "1.0"
definition_key: "external-item-learning"
definition_version: "1.0.0"
start_step: "extract"

limits:
  max_rework_cycles: 0
  max_step_attempts: 1

steps:
  - key: "extract"
    type: "agent"
    worker_role: "support"
    result_schema: "external-item-learning-result@1.0"
    on_success: "complete"

  - key: "complete"
    type: "terminal"
    terminal_status: "COMPLETED"
