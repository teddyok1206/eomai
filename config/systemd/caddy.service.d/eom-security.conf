[Service]
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0700
UMask=0077

# The Caddyfile moves the administration endpoint to this protected socket.
# Clear the package unit command so future reloads cannot fall back to TCP 2019.
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force --address unix//run/caddy-admin/admin.sock
