[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eom-platform"
version = "0.1.0"
description = "EOM protocol-first execution platform skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3.1,<0.4",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]

[project.scripts]
eomctl = "eomctl.cli:app"
eom-dev-report = "eom_dev_reporter.cli:main"
eom-workflow-runner = "eom_workflow_runner.cli:main"
eom-hwpx-application-runner = "eom_hwpx_manager.runner:main"

[tool.setuptools.packages.find]
where = [
  "packages/protocol",
  "packages/identifiers",
  "services/orchestrator",
  "apps/eomctl",
  "tools/dev_reporter",
  "packages/workflow",
  "services/workflow_runner",
  "packages/hwpx_contracts",
  "services/hwpx_manager",
  "packages/content_intake",
  "packages/content_pack",
  "packages/item_registry",
  "packages/operator_identity",
  "services/identity_service",
  "packages/catalog_contracts",
  "services/catalog_service",
]

[tool.setuptools.package-data]
eom_protocol = ["schemas/*.json"]
eom_hwpx_contracts = ["schemas/*.json"]
eom_workflow = [
  "resources/*.json",
  "resources/roles/*.json",
]
eom_catalog_contracts = [
  "resources/content-intake/*.json",
  "resources/content-pack/*.json",
  "resources/item-registry/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable PostgreSQL instance",
  "codex_live: consumes a live Codex subscription invocation and is opt-in",
  "workflow_codex_live: consumes multiple live Codex subscription invocations and is opt-in",
  "catalog_codex_live: validates opt-in live Content Pack workflow and Item registration runs",
  "dev_slack_live: sends one opt-in development report to a configured Slack webhook",
  "observe_integration: requires the installed eom_observe_ro PostgreSQL role",
  "observe_browser_live: validates the installed observability service and browser rendering",
  "api_integration: requires the isolated PostgreSQL identity schema and is opt-in",
  "api_service_live: validates the installed Application API service",
  "hwpx_reference_live: uses the fixed Hancom-created reference and immutable artifact storage",
  "privileged: requires an explicit isolated privileged test environment",
  "hwpx_privileged: validates HWPX ownership with real root-only filesystem operations",
  "workflow_privileged: validates the real private-group worker filesystem handoff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "packages/protocol",
  "packages/identifiers",
  "packages/workflow",
  "services/orchestrator",
  "services/workflow_runner",
  "packages/hwpx_contracts",
  "services/hwpx_manager",
  "packages/content_intake",
  "packages/content_pack",
  "packages/item_registry",
  "packages/operator_identity",
  "services/identity_service",
  "packages/api_contracts",
  "apps/application_api",
  "apps/web_gui",
  "packages/catalog_contracts",
  "services/catalog_service",
  "apps/eomctl",
  "tools/dev_reporter",
]
packages = [
  "eom_protocol",
  "eom_identifiers",
  "eom_workflow",
  "eom_workflow_runner",
  "eom_orchestrator",
  "eomctl",
  "eom_dev_reporter",
  "eom_hwpx_contracts",
  "eom_hwpx_manager",
  "eom_content_intake",
  "eom_content_pack",
  "eom_item_registry",
  "eom_operator_identity",
  "eom_identity_service",
  "eom_api_contracts",
  "eom_api",
  "eom_web_gui",
  "eom_catalog_contracts",
  "eom_catalog_service",
]
