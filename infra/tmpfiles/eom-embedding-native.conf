# Fixed namespace-denial roots must exist before PID1 constructs either sandbox.
# This allocates directories only; it grants no launch, model or source authority.
d /run/eom-embedding-native-index 0750 root eom -
d /run/eom-embedding-native-query 0750 root eom -
d /run/eom-embedding-native-probe 0700 root root -
