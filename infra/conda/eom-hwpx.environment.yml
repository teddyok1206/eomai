name: eom-hwpx
channels:
  - defaults
dependencies:
  - python=3.12
  # Node 20 is EOL. Kordoc 4.9.0 is qualified on this exact Node 22 LTS build;
  # defaults does not publish Node 22, so only this package uses conda-forge.
  - conda-forge::nodejs=22.23.2
  - pip
  - setuptools
  - wheel

# Runtime and validation packages are installed from the adjacent pinned pip lock. This avoids
# changing eom-core and keeps the builder release reproducible when Conda channel access is limited.
